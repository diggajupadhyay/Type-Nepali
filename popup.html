<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Type Nepal</title>
  <link rel="stylesheet" href="popup-styles.css">
</head>

<body role="application" aria-label="Type Nepal Extension">

  <header class="popup-header">
    <h1 class="popup-title">
      Type Nepali
    </h1>
    <p class="status-text">
      Status: <span id="span-btn" class="status-indicator status-on" aria-live="polite">Active</span>
    </p>
  </header>

  <main class="popup-main">
    <button
      id="btn"
      type="button"
      role="switch"
      aria-pressed="true"
      aria-labelledby="main-heading"
      tabindex="0"
      class="toggle-btn">
      <span class="btn-content">
        <span class="btn-icon" aria-hidden="true">⌨️</span>
        <span class="btn-text">On</span>
      </span>
    </button>

    <div class="instruction-container">
      <span class="hint-icon" aria-hidden="true">⚡</span>
      <p class="instruction">
        Press <kbd class="shortcut-key">Ctrl</kbd><kbd class="shortcut-key">Alt</kbd><kbd class="shortcut-key">N</kbd> to toggle
      </p>
    </div>
  </main>

  <footer class="popup-footer">
    <p class="version">Version 1.5.0</p>
    <p class="tagline">Made with ❤️ for Nepali community</p>
  </footer>

  <script src="./scripts/popup.js"></script>
</body>
</html>
